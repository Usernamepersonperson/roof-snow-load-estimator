[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roof-snow-load-estimator"
version = "0.1.0"
description = "Open-source roof snow-load monitor: snow depth to load, utilisation vs design load, alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "pandas>=2.0", "httpx>=0.27", "matplotlib>=3.8", "typer>=0.12"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
roofsnow = "roofsnow.cli:app"

[tool.setuptools]
packages = ["roofsnow"]

[tool.setuptools.package-data]
roofsnow = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "roofsnow.density.MassBalance"]
